 ],

var KINDCOLOR = { meal: "#2563eb", sight: "#e11d48", transfer: "#9ca3af", shop: "#7c3aed" };
var KINDNAME = { meal: "吃饭", sight: "景点", transfer: "转场", shop: "购物" };
var state = { day: 0, kinds: { meal: true, sight: true, transfer: true, shop: true }, side: "itin" };

var map = L.map("map", { zoomControl: true }).setView([29.585, 106.56], 12);
L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
  subdomains: ["1", "2", "3", "4"], maxZoom: 18, attribution: "© 高德地图 · 路径 © OSRM"
}).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

var legend = L.control({ position: "bottomright" });
legend.onAdd = function () {
  var d = L.DomUtil.create("div", "map-legend");
  d.innerHTML =
    '<div><span class="lg-line" style="background:#2563eb"></span>吃饭路线</div>' +
    '<div><span class="lg-line" style="background:#e11d48"></span>景点路线</div>' +
    '<div><span class="lg-line" style="background:#9ca3af"></span>转场（虚线=轨道/步行）</div>' +
    '<div><span class="lg-line" style="background:#7c3aed"></span>购物</div>' +
    '<div>🔵 餐厅　🔴 景点　🟣 购物　⬛ 酒店/机场</div>';
  return d;
};
legend.addTo(map);

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function icon(cls, txt) {
  var size = cls.indexOf("food") >= 0 ? 24 : cls.indexOf("spot") >= 0 ? 22 : cls.indexOf("hotel") >= 0 ? 19 : 22;
  return L.divIcon({ className: "", html: '<div class="mk ' + cls + '">' + (txt || "") + "</div>", iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
}
function restPopup(s) {
  var r = RESTAURANTS[s.rid] || {};
  return '<div class="pop-t">' + esc(s.n) + '</div><div class="pop-row">' + esc(r.addr || "") + '</div>' +
    '<div class="pop-row">排队：' + esc(r.q || "") + '</div>' +
    '<div class="pop-row">预约：' + esc(r.book || "") + '</div>' +
    '<div class="pop-warn">👉 ' + esc(r.tip || "") + "</div>";
}
function spotPopup(s) {
  var sp = SPOTINFO[s.sid] || {};
  return '<div class="pop-t">' + esc(s.n) + '</div><div class="pop-row">🎫 ' + esc(sp.ticket || "") + ' · 🎓 ' + esc(sp.student || "") + '</div>' +
    '<div class="pop-row">预约：' + esc(sp.rsvp || "") + '</div>' +
    '<div class="pop-row">' + esc(sp.note || "") + '</div>' +
    (sp.food ? '<div class="pop-row">🍜 ' + esc(sp.food) + "</div>" : "");
}

function shopPopup(s) {
  var sp = SHOPINFO[s.sid] || {};
  return '<div class="pop-t">' + esc(s.n) + '</div><div class="pop-row">' + esc(sp.addr || "") + '</div>' +
    '<div class="pop-row">' + esc(sp.note || "") + '</div>' +
    (sp.tip ? '<div class="pop-warn">👉 ' + esc(sp.tip) + "</div>" : "");
}

var dayGroups = [];
DAYS.forEach(function (d, di) {
  var grp = L.layerGroup().addTo(map);
  var g = { group: grp, lines: [], casings: [] };
  var num = 0;
  d.stops.forEach(function (s, i) {
    if (s.hide) return;
    num++;
    var cls = s.type === "food" ? "mk-food" + (s.rid === "kaka" || s.rid === "tianbang" || s.rid === "chaoxia" ? " mk-warn" : "")
            : s.type === "spot" ? "mk-spot" : s.type === "shop" ? "mk-shop" : s.type === "hotel" ? "mk-hotel" : "mk-airport";
    var glyph = s.type === "hotel" ? "宿" : s.type === "airport" ? "✈" : s.type === "shop" ? "购" : String(num);
    var m = L.marker([s.ll[1], s.ll[0]], { icon: icon(cls, glyph) });
    m.on("click", function () { map.flyTo([s.ll[1], s.ll[0]], 15, { duration: 0.5 }); });
    m.bindPopup(s.type === "food" ? restPopup(s) : s.type === "spot" ? spotPopup(s) : s.type === "shop" ? shopPopup(s)
      : '<div class="pop-t">' + esc(s.n) + '</div><div class="pop-row">' + esc(s.t) + "</div>");
    m.bindTooltip(esc(s.n), { direction: "top", offset: [0, -10] });
    s._m = m;
    m.addTo(grp);
  });
  // 备选点（不进路线，虚线蓝色标记）
  (d.alts || []).forEach(function (s) {
    var m = L.marker([s.ll[1], s.ll[0]], { icon: icon("mk-alt", "备") });
    m.on("click", function () { map.flyTo([s.ll[1], s.ll[0]], 15, { duration: 0.5 }); });
    m.bindPopup(restPopup(s));
    m.bindTooltip(esc(s.n), { direction: "top", offset: [0, -10] });
    s._m = m;
    m.addTo(grp);
  });
  d.legs.forEach(function (lg, i) {
    var a = d.stops[i].ll, b = d.stops[i + 1].ll;
    var pts;
    if (lg.route && window.ROUTES && ROUTES[lg.route]) {
      pts = ROUTES[lg.route].pts;
      if (lg.rev) pts = pts.slice().reverse();
    } else {
      pts = [[a[1], a[0]], [b[1], b[0]]];
    }
    var real = !!lg.route;
    var cas = L.polyline(pts, { color: "#ffffff", weight: real ? 7 : 5, opacity: 0.75, interactive: false });
    cas.addTo(grp);
    var line = L.polyline(pts, {
      color: KINDCOLOR[lg.kind], weight: real ? 4.5 : 3, opacity: 0.95,
      dashArray: real ? null : "6 6"
    });
    line.bindTooltip(esc(lg.label), { sticky: true });
    line._kind = lg.kind;
    line.addTo(grp);
    g.lines.push(line);
    g.casings.push(cas);
  });
  dayGroups.push(g);
});

/* ---- 控件 ---- */
var dayTabs = document.getElementById("dayTabs");
var layerChips = document.getElementById("layerChips");
var side = document.getElementById("side");

function chip(parent, label, on, cb, cls) {
  var b = document.createElement("button");
  b.className = "chip " + (cls || "") + (on ? " on" : "");
  b.textContent = label;
  b.onclick = cb;
  parent.appendChild(b);
  return b;
}
function fitAll() { map.flyToBounds(L.latLngBounds([[29.4655, 106.424], [29.7107, 106.6562]]).pad(0.05), { duration: 0.5 }); }
function renderWx() {
  var elx = document.getElementById("wxLine");
  if (state.day === 0) elx.textContent = DAYS.map(function (d) { return d.label.split("·")[1].trim() + " " + d.wx; }).join("　") + "（中央气象台 10.4 预报）";
  else elx.textContent = DAYS[state.day - 1].label + "　" + DAYS[state.day - 1].wx;
}
function renderTabs() {
  dayTabs.innerHTML = "";
  chip(dayTabs, "全部", state.day === 0, function () { state.day = 0; renderAll(); });
  DAYS.forEach(function (d, i) {
    chip(dayTabs, d.label, state.day === i + 1, function () { state.day = i + 1; renderAll(); });
  });
  chip(dayTabs, "全览", false, function () { fitAll(); });
  renderWx();
}
function renderLayers() {
  layerChips.innerHTML = "";
  ["meal", "sight", "transfer", "shop"].forEach(function (k) {
    chip(layerChips, KINDNAME[k] + "路线", state.kinds[k], function () {
      state.kinds[k] = !state.kinds[k];
      applyFilter();
      renderLayers();
    }, "lg");
  });
}
function applyFilter() {
  dayGroups.forEach(function (g, di) {
    var on = state.day === 0 || state.day === di + 1;
    if (on && !map.hasLayer(g.group)) g.group.addTo(map);
    if (!on && map.hasLayer(g.group)) map.removeLayer(g.group);
    if (on) g.lines.forEach(function (ln, i) {
      var vis = state.kinds[ln._kind];
      var cas = g.casings[i];
      ln.setStyle({ opacity: vis ? 0.95 : 0 });
      if (cas) cas.setStyle({ opacity: vis ? 0.75 : 0 });
      if (vis) { if (cas) cas.addTo(g.group); ln.addTo(g.group); }
      else { if (cas) g.group.removeLayer(cas); g.group.removeLayer(ln); }
    });
  });
  if (state.day > 0) {
    var pts = DAYS[state.day - 1].stops.map(function (s) { return [s.ll[1], s.ll[0]]; });
    map.flyToBounds(L.latLngBounds(pts).pad(0.15), { duration: 0.5 });
  }
  renderSide();
}

var SLOTH = ["上午", "中午", "下午", "晚上"];
function renderSide() {
  if (state.side === "list") { renderList(); return; }
  var html = "";
  var list = state.day === 0 ? DAYS.map(function (d, i) { return i; }) : [state.day - 1];
  list.forEach(function (di) {
    var d = DAYS[di];
    html += '<div class="daycard' + (state.day === di + 1 ? " cur" : "") + '" data-day="' + di + '">';
    html += '<div class="dh">' + d.label + ' <span class="w">' + d.wx + "</span></div>";
    html += '<div class="dsum">' + d.summary + "</div>";
    var lastSlot = "";
    d.stops.forEach(function (s, i) {
      if (s.slot !== lastSlot) { lastSlot = s.slot; html += '<div class="slot-h">' + lastSlot + "</div>"; }
      var dot = s.type === "food" ? "#2563eb" : s.type === "spot" ? "#e11d48" : s.type === "shop" ? "#7c3aed" : "#6b7280";
      html += '<div class="stop" data-d="' + di + '" data-i="' + i + '"><span class="dot" style="background:' + dot + '"></span><span class="tm">' + esc(s.t) + "</span><span>" + esc(s.n) + "</span></div>";
    });
    (d.alts || []).forEach(function (s, ai) {
      html += '<div class="stop" data-alt="' + di + ':' + ai + '"><span class="dot" style="background:#fff;border:1.5px dashed #2563eb"></span><span class="tm">' + esc(s.t) + "</span><span>" + esc(s.n) + "</span></div>";
    });
    html += "</div>";
  });
  side.innerHTML = html;
  side.querySelectorAll(".stop").forEach(function (e) {
    e.onclick = function () {
      var alt = e.getAttribute("data-alt");
      var s;
      if (alt) { var p = alt.split(":"); s = DAYS[+p[0]].alts[+p[1]]; }
      else { s = DAYS[+e.getAttribute("data-d")].stops[+e.getAttribute("data-i")]; }
      map.flyTo([s.ll[1], s.ll[0]], 15, { duration: 0.6 });
      if (s._m) setTimeout(function () { s._m.openPopup(); }, 650);
    };
  });
  side.querySelectorAll(".daycard").forEach(function (e) {
    e.addEventListener("click", function (ev) {
      if (ev.target.closest(".stop")) return;
      var di = +e.getAttribute("data-day");
      if (state.day !== di + 1) { state.day = di + 1; renderAll(); }
    });
  });
}

// 清单 tab：景点/餐馆纯文字列表（地图外单列）
function renderList() {
  var html = '<div class="lsec">景点（' + 10 + ' 个，按行程顺序）</div>';
  var seen = {};
  DAYS.forEach(function (d, di) {
    d.stops.forEach(function (s) {
      if (s.type !== "spot" || seen[s.sid]) return;
      seen[s.sid] = true;
      var sp = SPOTINFO[s.sid] || {};
      html += '<div class="lrow" data-ll="' + s.ll[1] + "," + s.ll[0] + '"><span class="ln">' + esc(s.n) + '</span> <span class="lm">' + d.label + '</span>' +
        '<div class="lm">🎫 ' + esc(sp.ticket || "") + " · 🎓 " + esc(sp.student || "") + '</div>' +
        '<div class="lr">预约：' + esc(sp.rsvp || "") + "</div></div>";
    });
  });
  html += '<div class="lsec">餐馆（11 家，按行程顺序）</div>';
  var seen2 = {};
  DAYS.forEach(function (d, di) {
    d.stops.forEach(function (s) {
      if (s.type !== "food" || seen2[s.rid]) return;
      seen2[s.rid] = true;
      var r = RESTAURANTS[s.rid] || {};
      html += '<div class="lrow" data-ll="' + s.ll[1] + "," + s.ll[0] + '"><span class="ln">' + esc(s.n) + '</span> <span class="lm">' + d.label + '</span>' +
        '<div class="lm">排队：' + esc(r.q || "") + '</div>' +
        '<div class="lr">预约：' + esc(r.book || "") + "</div></div>";
    });
  });
  html += '<div class="lsec">购物</div>';
  var seen3 = {};
  DAYS.forEach(function (d) {
    d.stops.forEach(function (s) {
      if (s.type !== "shop" || seen3[s.sid]) return;
      seen3[s.sid] = true;
      var sp = SHOPINFO[s.sid] || {};
      html += '<div class="lrow" data-ll="' + s.ll[1] + "," + s.ll[0] + '"><span class="ln">' + esc(s.n) + '</span> <span class="lm">' + d.label + '</span>' +
        '<div class="lm">' + esc(sp.addr || "") + '</div>' +
        '<div class="lm">' + esc(sp.note || "") + "</div></div>";
    });
  });
  side.innerHTML = html;
  side.querySelectorAll(".lrow").forEach(function (e) {
    e.onclick = function () {
      var ll = e.getAttribute("data-ll").split(",");
      map.flyTo([+ll[0], +ll[1]], 15, { duration: 0.6 });
    };
  });
}

document.getElementById("tabItin").onclick = function () { state.side = "itin"; this.classList.add("on"); document.getElementById("tabList").classList.remove("on"); renderSide(); };
document.getElementById("tabList").onclick = function () { state.side = "list"; this.classList.add("on"); document.getElementById("tabItin").classList.remove("on"); renderSide(); };

function renderAll() { renderTabs(); renderLayers(); applyFilter(); }
renderAll();
fitAll();
// 视口变化（手机横竖屏/窗口缩放）后让 Leaflet 重算容器尺寸
var _rsz;
function reflow(){ clearTimeout(_rsz); _rsz = setTimeout(function(){ map.invalidateSize(); }, 200); }
window.addEventListener("resize", reflow);
window.addEventListener("orientationchange", reflow);
setTimeout(function(){ map.invalidateSize(); fitAll(); }, 400);
</script>
